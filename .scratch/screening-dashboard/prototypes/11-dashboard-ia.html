<script>
/* =====================================================================
   THROWAWAY PROTOTYPE — ticket 11. Fabricated data, real shapes.
   ===================================================================== */

/* ---------- seeded rng so charts are stable across renders ---------- */
function rng(seed) {
  let s = seed >>> 0;
  return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
}

/* ---------- synthetic bars: momentum leg, then a contracting base ---------- */
function genBars(seed, adr, L, drift) {
  const r = rng(seed);
  const n = 110, bars = [];
  let px = 100;
  for (let i = 0; i < n; i++) {
    const inBase = i >= n - L;
    let vol;
    if (inBase) {
      // contraction: range shrinks toward the last bar
      const t = (i - (n - L)) / Math.max(1, L - 1);
      vol = adr * (0.85 - 0.45 * t) / 100;
      px *= 1 + (r() - 0.5) * vol * 0.9;
    } else {
      const legStrength = i > n - L - 45 ? drift : drift * 0.25;
      vol = adr / 100;
      px *= 1 + legStrength + (r() - 0.5) * vol * 1.5;
    }
    const o = px * (1 + (r() - 0.5) * vol * 0.4);
    const c = px * (1 + (r() - 0.5) * vol * 0.4);
    const h = Math.max(o, c) * (1 + r() * vol * 0.55);
    const l = Math.min(o, c) * (1 - r() * vol * 0.55);
    const base = 1_000_000 * (0.8 + r() * 0.5);
    bars.push({ o, h, l, c, v: inBase ? base * (0.45 - 0.15 * r()) : base * (1 + r() * 0.9) });
  }
  return bars;
}

function sma(bars, len, key = 'c') {
  const out = new Array(bars.length).fill(null);
  let sum = 0;
  for (let i = 0; i < bars.length; i++) {
    sum += bars[i][key];
    if (i >= len) sum -= bars[i - len][key];
    if (i >= len - 1) out[i] = sum / len;
  }
  return out;
}

/* least-squares fit over the base highs / lows (ticket 08's triangle test) */
function fit(bars, L, key) {
  const start = bars.length - L, pts = [];
  for (let i = start; i < bars.length; i++) pts.push([i, bars[i][key]]);
  const n = pts.length;
  const mx = pts.reduce((a, p) => a + p[0], 0) / n;
  const my = pts.reduce((a, p) => a + p[1], 0) / n;
  let num = 0, den = 0;
  for (const [x, y] of pts) { num += (x - mx) * (y - my); den += (x - mx) ** 2; }
  const m = den ? num / den : 0;
  return { m, b: my - m * mx };
}

/* ---------- the universe of fake candidates ---------- */

  ['IDX','ANTM.JK','Aneka Tambang','Basic Materials','Gold',4,'WATCHING',8,5.1,'Rp 210B',4,[11,6,4,7,3],true,0.72,-2.8,2103,0.008],
  ['IDX','INCO.JK','Vale Indonesia','Basic Materials','Other Industrial Metals & Mining',3,'WATCHING',10,4.6,'Rp 64B',2,[null,null,14,11,null],true,0.86,-3.6,2104,0.006],
  ['IDX','PTBA.JK','Bukit Asam','Energy','Thermal Coal',3,'DRIFT',13,4.1,'Rp 52B',2,[null,21,18,null,null],false,0.91,-0.9,2105,0.004],
  ['IDX','TINS.JK','Timah','Basic Materials','Other Industrial Metals & Mining',2,'WATCHING',6,6.3,'Rp 33B',1,[null,null,29,null,null],true,0.97,-4.1,2106,0.005],
];

const CANDS = RAW.map((r, i) => {
  const [market, ticker, name, sector, industry, stars, state, L, adr, dv, k5, ranks, conf, stopVsAdr, distPct, seed, drift] = r;
  const bars = genBars(seed, adr, L, drift);
  const last = bars[bars.length - 1].c;
  const hi = fit(bars, L, 'h');
  const lo = fit(bars, L, 'l');
  const flatMax = Math.max(...bars.slice(-L).map(b => b.h));
  const sloped = hi.m * (bars.length - 1) + hi.b;
  const trigger = Math.min(flatMax, sloped);
  return {
    id: i, market, ticker, name, sector, industry, stars, state, L, adr, dv, k5, ranks, conf,
    stopVsAdr, distPct, bars, last, hi, lo, trigger, flatMax, sloped,
    baseLow: Math.min(...bars.slice(-L).map(b => b.l)),
  };
});

/* ---------- regimes (ticket 10) ---------- */
const REGIMES = [
  { market: 'IDX', index: '^JKSE', state: 'FRIENDLY', posture: 'Full size', asOf: '2026-08-05 close (WIB)', breadth: 61, fresh: true },
  { market: 'US',  index: '^IXIC', state: 'CHOPPY',   posture: 'Reduced size', asOf: '2026-08-04 close (ET)', breadth: 44, fresh: false },

/* ---------- leaderboards (ticket 06) ----------
   R3: five SEPARATE boards per market, never merged. R4: top 30, constant count.
   R9: ranked on pure return. R10: no smoothing; new entrants carry a NEW marker.
   R11: k/5 breadth badge. R12: "up ≥30% in 5d" is a FLAG on the 1w board, not a board.
   R8: ADR does nothing by default — one toggle, off.                              */
const LOOKBACKS = ['1w', '1m', '3m', '6m', '12m'];
const BOARD_N = 30;

const POOL = {
  US: ['NBIS','TSSI','CLS','RKLB','APP','HOOD','ONON','PLTR','IONQ','SMCI','VRT','ANET','MU','AVGO',
       'CRDO','ALAB','NVDA','COIN','MSTR','RDDT','ASTS','LUNR','OKLO','SMR','VST','TLN','GEV','PWR',
       'NRG','HIMS','DUOL','TOST','AXON','CAVA','ELF','CELH','SEZL','AFRM','UPST','APLD'],
  IDX: ['BRMS.JK','MDKA.JK','ANTM.JK','INCO.JK','PTBA.JK','TINS.JK','ADRO.JK','ITMG.JK','BRPT.JK',
        'TPIA.JK','BREN.JK','CUAN.JK','AMMN.JK','PANI.JK','NCKL.JK','ESSA.JK','MEDC.JK','PGAS.JK',
        'ELSA.JK','RAJA.JK','HRUM.JK','DEWA.JK','ENRG.JK','BUMI.JK','ARTO.JK','BUKA.JK','GOTO.JK',
        'EMTK.JK','SMGR.JK','INTP.JK','ICBP.JK','MYOR.JK','KLBF.JK','UNTR.JK','ASII.JK','TLKM.JK',
        'BBRI.JK','BMRI.JK','BBCA.JK','AKRA.JK'],
};

/* rough top-of-board magnitudes per lookback, and how much of the board turns over nightly */
const LB_SPEC = {
  '1w':  { top:  46, churn: 0.53 },
  '1m':  { top:  92, churn: 0.20 },
  '3m':  { top: 224, churn: 0.10 },
  '6m':  { top: 330, churn: 0.07 },
  '12m': { top: 640, churn: 0.03 },
};

/* The pool has to be much deeper than the 30 board slots, or every name lands on
   every board and the k/5 badge reads 5/5 everywhere — ticket 06 measured only
   3 of 1,964 US names leading all five windows. Pad with filler tickers. */
function deepPool(mkt, seed) {
  const r = rng(seed), out = POOL[mkt].slice();
  const A = 'ABCDEFGHIJKLMNOPRSTUVWXYZ';
  const target = mkt === 'US' ? 240 : 200;
  while (out.length < target) {
    const len = mkt === 'IDX' ? 4 : 3 + (r() < 0.4 ? 1 : 0);
    let s = '';
    for (let i = 0; i < len; i++) s += A[Math.floor(r() * A.length)];
    const t = mkt === 'IDX' ? s + '.JK' : s;
    if (!out.includes(t)) out.push(t);
  }
  return out;
}

function buildBoards(mkt, seed0) {
  const pool = deepPool(mkt, seed0 + 500);
  const adrOf = {};
  const ra = rng(seed0 + 77);
  pool.forEach(t => { adrOf[t] = 3.4 + ra() * 6.4; });

  // ticket 08 gates candidates on top-decile membership, so every name in the
  // workbench must plausibly appear on at least one board — bias their draws up.
  const isCand = new Set(CANDS.filter(c => c.market === mkt).map(c => c.ticker));

  const boards = {};
  LOOKBACKS.forEach((lb, li) => {
    const r = rng(seed0 + li * 31 + 5);
    const spec = LB_SPEC[lb];
    const rows = pool.map(t => {
      const u = r();
      const draw = isCand.has(t) ? Math.pow(u, 0.22) : u;
      return { t, ret: spec.top * Math.pow(draw, 1.7), adr: adrOf[t] };
    });
    rows.sort((a, b) => b.ret - a.ret);
    boards[lb] = rows.slice(0, BOARD_N).map(x => ({
      ...x,
      isNew: r() < spec.churn,
      flag: lb === '1w' && x.ret >= 30,
    }));
  });

  // R11 — k/5: how many of this market's five boards the name leads
  const count = {};
  LOOKBACKS.forEach(lb => boards[lb].forEach(x => { count[x.t] = (count[x.t] || 0) + 1; }));
  LOOKBACKS.forEach(lb => boards[lb].forEach(x => { x.k = count[x.t]; }));
  return boards;
}

const BOARDS = { US: buildBoards('US', 9001), IDX: buildBoards('IDX', 4002) };

/* ---------- sectors (ticket 07) ----------
   [name, n, shares by lookback, rank 20 sessions ago]
   The 20-session window is ticket 07's existing temporal-delta window (S3),
   inherited from §2/§3.5's 10/20-day horizon — NOT a second window invented here. */

    ['Energy',           88, [ 6.8, 8.2,12.4,18.8,21.2], 6],

    ['Basic Materials',  38, [52.6,44.7,39.5,31.6,28.9], 2],
    ['Energy',           31, [22.6,25.8,29.0,35.5,38.7], 1],
    ['Utilities',        10, [30.0,20.0,10.0,10.0, 0.0], 6],
    ['Industrials',      27, [14.8,11.1,11.1, 7.4, 7.4], 4],
    ['Financial Services',44,[ 9.1,11.4,13.6,18.2,20.5], 3],

/* rank today by 1m share, plus k = members in that decile (ticket 07 S4 shows k/n
   on every row, and requires k ≥ 2 before a sector may top the rotation board) */
function sectorRows(mkt) {
  return SECTORS[mkt]
    .map(([name, n, sh, prevRank]) => ({
      name, n, sh, prevRank,
      k: Math.round((sh[1] / 100) * n),
      shape: sh[0] - sh[3],
    }))
    .sort((a, b) => b.sh[1] - a.sh[1])
    .map((r, i) => ({ ...r, rank: i + 1, move: r.prevRank - (i + 1) }));
}

/* ▲2 / ▼1 / — , with the move muted when it rests on too few names to mean anything */
function moveCell(r) {
  if (r.move === 0) return '<span class="mut" style="font-size:11px">—</span>';
  const thin = r.k < 2;
  const cls = thin ? 'mut' : (r.move > 0 ? 'up' : 'dn');
  const arrow = r.move > 0 ? '▲' : '▼';
  const title = thin
    ? `moved ${Math.abs(r.move)} on ${r.k} name${r.k === 1 ? '' : 's'} — quantization, not rotation`
    : `${r.move > 0 ? 'up' : 'down'} ${Math.abs(r.move)} places vs 20 sessions ago`;
  return `<span class="${cls}" style="font-size:11px" title="${title}">${arrow}${Math.abs(r.move)}${thin ? '<span style="opacity:.7">?</span>' : ''}</span>`;
}

/* ---------- score breakdown (§3.5) ---------- */
function breakdown(c) {
  const on = {
    tight:  c.stars >= 4,
    order:  c.stars >= 4 || c.state === 'TRIGGERED',
    prior:  true,
    hl:     c.stars >= 3,
    ma:     c.stopVsAdr < 0.85,
    vol:    c.stars >= 3,
    sector: c.conf,
    adr:    parseFloat(c.adr) >= 5,
  };
  return [
    ['Tightness — range narrowing vs √L baseline', 2, on.tight],
    ['Orderliness — churn ratio', 2, on.order],
    ['Prior move — top decile 1m/3m/6m', 1, on.prior],
    ['Higher lows intact', 1, on.hl],
    ['MA catch-up — 10/20 risen to price', 1, on.ma],
    ['Volume dry-up in the base', 1, on.vol],
    ['Sector confirmation — LOO share ≥ 10%', 1, on.sector],
    ['ADR ≥ 5%', 1, on.adr],
  ];
}

/* ---------- chart ---------- */
function drawChart(cv, c, opts = {}) {
  const dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth, H = opts.height || 260;
  if (!W) return;
  cv.width = W * dpr; cv.height = H * dpr;
  cv.style.height = H + 'px';
  const x = cv.getContext('2d');
  x.setTransform(dpr, 0, 0, dpr, 0, 0);
  x.clearRect(0, 0, W, H);

  const cs = getComputedStyle(document.documentElement);
  const CU = cs.getPropertyValue('--candle-up').trim();
  const CD = cs.getPropertyValue('--candle-dn').trim();
  const GR = cs.getPropertyValue('--grid').trim();
  const AC = cs.getPropertyValue('--accent').trim();
  const I3 = cs.getPropertyValue('--ink-3').trim();

  const show = opts.bars || 70;
  const all = c.bars, n = all.length;
  const from = Math.max(0, n - show);
  const seg = all.slice(from);

  const volH = Math.round(H * 0.18);
  const priceH = H - volH - 6;
  const padR = 46;
  const plotW = W - padR;

  const hiV = Math.max(...seg.map(b => b.h)) * 1.015;
  const loV = Math.min(...seg.map(b => b.l)) * 0.985;
  const Y = v => priceH - ((v - loV) / (hiV - loV)) * priceH;
  const X = i => (i / seg.length) * plotW + (plotW / seg.length) * 0.5;
  const bw = Math.max(1.5, (plotW / seg.length) * 0.62);

  // base shading
  const baseFrom = seg.length - c.L;
  x.fillStyle = AC; x.globalAlpha = 0.07;
  x.fillRect(X(baseFrom) - bw, 0, plotW - X(baseFrom) + bw, priceH);
  x.globalAlpha = 1;

  // gridlines
  x.strokeStyle = GR; x.lineWidth = 1;
  for (let g = 0; g <= 3; g++) {
    const yy = Math.round((priceH / 3) * g) + 0.5;
    x.beginPath(); x.moveTo(0, yy); x.lineTo(plotW, yy); x.stroke();
  }

  // moving averages
  const m10 = sma(all, 10), m20 = sma(all, 20), m50 = sma(all, 50);
  const line = (arr, col, w) => {
    x.strokeStyle = col; x.lineWidth = w; x.globalAlpha = .75; x.beginPath();
    let started = false;
    for (let i = 0; i < seg.length; i++) {
      const v = arr[from + i]; if (v == null) continue;
      const px = X(i), py = Y(v);
      if (!started) { x.moveTo(px, py); started = true; } else x.lineTo(px, py);
    }
    x.stroke(); x.globalAlpha = 1;
  };
  line(m50, I3, 1);
  line(m20, AC, 1.4);
  line(m10, I3, 1);

  // candles
  seg.forEach((b, i) => {
    const up = b.c >= b.o;
    x.strokeStyle = up ? CU : CD; x.fillStyle = up ? CU : CD; x.lineWidth = 1;
    const cx = Math.round(X(i)) + 0.5;
    x.beginPath(); x.moveTo(cx, Y(b.h)); x.lineTo(cx, Y(b.l)); x.stroke();
    const top = Y(Math.max(b.o, b.c)), bot = Y(Math.min(b.o, b.c));
    x.fillRect(cx - bw / 2, top, bw, Math.max(1, bot - top));
  });

  // fitted triangle over the base (ticket 08)
  const fitLine = (f, dash) => {
    x.save(); x.setLineDash(dash); x.strokeStyle = AC; x.lineWidth = 1.4;
    x.beginPath();
    const i0 = baseFrom, i1 = seg.length - 1;
    x.moveTo(X(i0), Y(f.m * (from + i0) + f.b));
    x.lineTo(X(i1), Y(f.m * (from + i1) + f.b));
    x.stroke(); x.restore();
  };
  fitLine(c.hi, []); fitLine(c.lo, [3, 3]);

  // trigger level
  x.save(); x.setLineDash([2, 4]); x.strokeStyle = AC; x.lineWidth = 1;
  x.beginPath(); x.moveTo(0, Y(c.trigger)); x.lineTo(plotW + 4, Y(c.trigger)); x.stroke(); x.restore();
  x.fillStyle = AC; x.font = '600 10px ' + cs.getPropertyValue('--mono');
  x.fillText('TRIG', plotW + 6, Y(c.trigger) + 3);

  // base low / stop
  x.save(); x.setLineDash([1, 3]); x.strokeStyle = I3; x.lineWidth = 1;
  x.beginPath(); x.moveTo(X(baseFrom) - bw, Y(c.baseLow)); x.lineTo(plotW + 4, Y(c.baseLow)); x.stroke(); x.restore();
  x.fillStyle = I3; x.fillText('STOP', plotW + 6, Y(c.baseLow) + 3);

  // volume
  const vmax = Math.max(...seg.map(b => b.v));
  seg.forEach((b, i) => {
    const h = (b.v / vmax) * volH;
    const inBase = i >= baseFrom;
    x.fillStyle = inBase ? AC : I3;
    x.globalAlpha = inBase ? 0.5 : 0.28;
    x.fillRect(X(i) - bw / 2, H - h, bw, h);
  });
  x.globalAlpha = 1;
}

/* redraw every visible canvas */
function paintAll() {
  document.querySelectorAll('canvas[data-cand]').forEach(cv => {
    const c = CANDS[+cv.dataset.cand];
    drawChart(cv, c, { height: +cv.dataset.h || 260, bars: +cv.dataset.n || 70 });
  });
}

/* ---------- small html helpers ---------- */
const esc = s => String(s).replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
const stars = n => `<span class="stars" aria-label="${n} of 5 stars">${'★'.repeat(n)}<span class="off">${'★'.repeat(5 - n)}</span></span>`;
const statePill = s => ({
  TRIGGERED: '<span class="pill trig">Triggered</span>',
  NEW:       '<span class="pill new">New setup</span>',
  WATCHING:  '<span class="pill watch">Watching</span>',
  DRIFT:     '<span class="pill drift">Line drift</span>',
}[s]);
const signed = v => `<span class="num ${v >= 0 ? 'up' : 'dn'}">${v >= 0 ? '+' : ''}${v.toFixed(1)}%</span>`;
const k5 = k => `<span class="num mut" title="top decile in ${k} of 5 lookbacks">${k}/5</span>`;

function regimeBanner(r) {
  return `<div class="regime ${r.state}">
    <span class="mkt">${r.market}</span>
    <span class="state">${r.state}</span>
    <span class="posture">${r.posture}</span>

  </div>`;
}

function breakdownHtml(c) {
  const rows = breakdown(c);
  const total = rows.reduce((a, [, w, on]) => a + (on ? w : 0), 0);
  return `<div class="breakdown">
    ${rows.map(([d, w, on]) => `<div class="row">
      <span class="dim">${d}</span>
      <span class="w">×${w}</span>
      <span class="pt ${on ? 'on' : 'off'}">${on ? w : 0}</span>
    </div>`).join('')}
    <div class="total"><span>${total} / 10 → ${(total / 2).toFixed(1)} stars</span>${stars(c.stars)}</div>
  </div>`;
}

function factsHtml(c) {
  return `<dl class="kv">
    <dt>Base length</dt><dd>${c.L} sessions</dd>
    <dt>Trigger</dt><dd>${c.trigger.toFixed(2)} <span class="mut">(${c.sloped < c.flatMax ? 'sloped line' : 'flat high'})</span></dd>

      badge</b>: how many of the five lookbacks that name leads. <b>new</b> marks a name that was not on this
      board last night — the 1w board turns over roughly half its rows nightly and that is reported, not
      smoothed. <b>30/5d</b> is §1's "up ≥30% in five days" as a flag on the 1w board rather than a sixth board.
      The ADR toggle is <b>off by default and does nothing until you touch it</b> (R8).
      <br><br>
      This tab is <b>off the nightly path</b>: ticket 08 gates every candidate on top-decile membership
      already, so anything here that matters has already become a candidate in the workbench.
    </p>
  </div>`;
}

function VariantC() {
  if (tabC === 'BOARDS') {
    return `<div class="shell">
      <header style="display:flex;align-items:baseline;gap:var(--s4);margin-bottom:var(--s4)">
        <h1 style="font-size:20px;letter-spacing:-0.02em">Screen</h1>
        <span class="mut num">Wed 5 Aug 2026</span>
      </header>
      <div style="display:flex;gap:var(--s1);border-bottom:1px solid var(--line)">
        ${['IDX', 'US'].map(m => `<button data-pick="C:${m}" style="background:transparent;border:1px solid transparent;
          border-bottom-color:var(--line);margin-bottom:-1px;padding:var(--s2) var(--s5);border-radius:5px 5px 0 0;
          font:inherit;color:var(--ink-3);cursor:pointer">${m} <span class="num" style="opacity:.6">${CANDS.filter(x => x.market === m).length}</span></button>`).join('')}
        <button data-pick="C:BOARDS" style="background:var(--panel);border:1px solid var(--line);border-bottom-color:var(--panel);
          margin-bottom:-1px;padding:var(--s2) var(--s5);border-radius:5px 5px 0 0;font:inherit;font-weight:700;
          color:var(--ink);cursor:pointer">Boards</button>
      </div>
      ${BoardsScreen()}
    </div>`;
  }
  const r = REGIMES.find(x => x.market === tabC);
  const list = CANDS.filter(x => x.market === tabC);
  const c = CANDS[selC[tabC]];
  const secs = sectorRows(tabC);

  const tab = m => `<button data-pick="C:${m}" style="
      background:${m === tabC ? 'var(--panel)' : 'transparent'};
      border:1px solid ${m === tabC ? 'var(--line)' : 'transparent'};
      border-bottom-color:${m === tabC ? 'var(--panel)' : 'var(--line)'};
      margin-bottom:-1px;padding:var(--s2) var(--s5);border-radius:5px 5px 0 0;
      font:inherit;font-weight:${m === tabC ? 700 : 400};color:${m === tabC ? 'var(--ink)' : 'var(--ink-3)'};
      cursor:pointer">
      ${m} <span class="num" style="opacity:.6">${CANDS.filter(x => x.market === m).length}</span>
    </button>`;

  return `<div class="shell">
    <header style="display:flex;align-items:baseline;gap:var(--s4);margin-bottom:var(--s4)">
      <h1 style="font-size:20px;letter-spacing:-0.02em">Screen</h1>
      <span class="mut num">Wed 5 Aug 2026</span>
    </header>

    <div style="display:flex;gap:var(--s1);border-bottom:1px solid var(--line)">
      ${tab('IDX')}${tab('US')}
      <button data-pick="C:BOARDS" style="background:transparent;border:1px solid transparent;
        border-bottom-color:var(--line);margin-bottom:-1px;padding:var(--s2) var(--s5);
        border-radius:5px 5px 0 0;font:inherit;color:var(--ink-3);cursor:pointer">Boards</button>
      <span class="mut" style="margin-left:auto;align-self:center;padding-bottom:var(--s2);font-size:11.5px">
        5 lookbacks × 2 markets — off the nightly path
      </span>
    </div>

    <div style="margin:var(--s4) 0">${regimeBanner(r)}</div>

    <div style="display:grid;grid-template-columns:0.95fr 1.4fr 1.15fr;gap:var(--s3);align-items:start">
      <div class="card">
        <div style="padding:var(--s2) var(--s3);border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:var(--s2)">
          <span class="eyebrow">${tabC} setups</span>
          <span class="mut" style="font-size:11px;margin-left:auto">sorted by score</span>
        </div>
        <table class="grid">
          <thead><tr>
            <th>Name</th><th class="r">Score</th><th class="r" title="distance to trigger">Δtrig</th>
            <th class="r" title="implied stop width vs 1×ADR">Stop</th><th class="r" title="top decile in k of 5 lookbacks">k/5</th>
          </tr></thead>
          <tbody>${list.slice().sort((a, b) => b.stars - a.stars).map(x => `<tr data-pick="P:${x.id}" class="${x.id === c.id ? 'sel' : ''}">
            <td><div><span class="tick">${x.ticker.replace('.JK', '')}</span></div>
                <div style="font-size:11px" class="mut">${x.industry}</div></td>
            <td class="r">${stars(x.stars)}<div style="font-size:11px" class="mut">${x.state.toLowerCase()}</div></td>
            <td class="r num" style="font-size:12px">${x.distPct >= 0 ? '+' : ''}${x.distPct.toFixed(1)}%</td>
            <td class="r num" style="font-size:12px">${x.stopVsAdr.toFixed(2)}×</td>
            <td class="r">${k5(x.k5)}</td>
          </tr>`).join('')}</tbody>
        </table>
      </div>

      <div class="card" style="padding:var(--s3)">
        <div style="display:flex;align-items:baseline;gap:var(--s3);margin-bottom:var(--s2)">
          <span class="tick" style="font-size:16px">${c.ticker}</span>${stars(c.stars)}${statePill(c.state)}
        </div>
        <canvas data-cand="${c.id}" data-h="270"></canvas>
        <div style="margin-top:var(--s3);display:grid;grid-template-columns:1fr 1fr;gap:var(--s4)">
          <div>${breakdownHtml(c)}</div><div>${factsHtml(c)}</div>
        </div>
      </div>

      <div style="display:grid;gap:var(--s3)">
        <div class="card">
          <div style="padding:var(--s2) var(--s3);border-bottom:1px solid var(--line)">
            <span class="eyebrow">Sector rotation · ${tabC}</span>
          </div>
          <table class="grid" style="font-size:12px">
            <thead><tr>
              <th style="width:16px">#</th>
              <th title="rank change vs 20 sessions ago">Δ20d</th>
              <th>Sector</th>
              <th class="r" title="share of this sector's members in the 1m top decile">1m</th>
              <th class="r" title="share(1w) − share(6m)">shape</th>
            </tr></thead>
            <tbody>${secs.map(r => `<tr class="${r.name === c.sector ? 'sel' : ''}">
                <td class="num mut" style="padding-right:0">${r.rank}</td>
                <td style="padding-left:5px">${moveCell(r)}</td>
                <td>${r.name}<div style="font-size:10.5px" class="mut">${r.k}/${r.n} in decile</div></td>
                <td class="r num">${r.sh[1].toFixed(1)}%</td>
                <td class="r num ${r.shape >= 0 ? 'up' : 'dn'}">${r.shape >= 0 ? '+' : ''}${r.shape.toFixed(1)}</td>
              </tr>`).join('')}</tbody>
          </table>
          <div style="padding:var(--s2) var(--s3);border-top:1px solid var(--line-soft);font-size:10.5px" class="mut">
            Δ20d is places moved since 20 sessions ago. A greyed <b>▲n?</b> rests on
            fewer than 2 names — quantization, not rotation.
          </div>
        </div>
      </div>
    </div>

    <p class="note" style="margin:var(--s5) 0;max-width:64ch">
      <b>Settled in session.</b> Market is the top-level axis — the two close hours apart, so you work one
      at a time and staleness is structural rather than a warning label. The list sorts by <b>star score</b>,
      not by proximity to the trigger. Six columns earn their place: ticker, score, distance to trigger,
      stop width vs 1×ADR, industry and the k/5 breadth badge — everything else lives in the chart panel.
      Sector rotation sits beside the candidate because §3.5 makes sector a scoring input, not a report,
      and carries a <b>Δ20d rank-movement column</b> over ticket 07's existing 20-session window — greyed
      with a <b>?</b> wherever the move rests on fewer than two names, which is routine on IDX and almost
      never happens on US. The decile leaderboards are a <b>peer tab, off the nightly path</b>, and there
      is <b>no rejected-candidates view in v1</b>.
    </p>
  </div>`;
}

/* ---------- variant plumbing ---------- */
const VARIANTS = [
  ['C', 'Workbench — market is the axis · CHOSEN', VariantC],
  ['A', 'Tonight — a run-sheet you finish · rejected', VariantA],
  ['B', 'Console — one dense screen · rejected', VariantB],
];

function current() {
  const k = new URLSearchParams(location.search).get('variant') || 'C';
  const i = VARIANTS.findIndex(v => v[0] === k.toUpperCase());
  return i < 0 ? 0 : i;
}

function render() {
  const i = current();
  document.getElementById('app').innerHTML = VARIANTS[i][2]();
  document.getElementById('sw-label').innerHTML = `${VARIANTS[i][0]}<small>${esc(VARIANTS[i][1])}</small>`;
  requestAnimationFrame(paintAll);
}

function go(i) {
  const u = new URL(location.href);
  u.searchParams.set('variant', VARIANTS[i][0]);
  history.replaceState({}, '', u);
  render();
}

document.querySelectorAll('#switcher button').forEach(b => {
  b.addEventListener('click', () => {
    const n = VARIANTS.length;
    go((current() + (+b.dataset.step) + n) % n);
  });
});

document.addEventListener('keydown', e => {
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
  const n = VARIANTS.length;
  if (e.key === 'ArrowLeft')  go((current() - 1 + n) % n);
  if (e.key === 'ArrowRight') go((current() + 1) % n);
  if (e.key === 'j' || e.key === 'k') {
    if (VARIANTS[current()][0] !== 'B') return;
    selB = (selB + (e.key === 'j' ? 1 : -1) + CANDS.length) % CANDS.length;
    render();
  }
});

document.addEventListener('click', e => {
  if (e.target.dataset && e.target.dataset.toggle === 'adr') { boardAdr = e.target.checked; render(); return; }
  const el = e.target.closest('[data-pick]');
  if (!el) return;
  const [kind, val] = el.dataset.pick.split(':');
  if (kind === 'B')  { selB = +val; render(); }
  if (kind === 'C')  {
    // arriving at Boards keeps you in the market you were already working
    if (val === 'BOARDS' && tabC !== 'BOARDS') boardMkt = tabC;
    tabC = val; render();
  }
  if (kind === 'P')  { selC[tabC] = +val; render(); }
  if (kind === 'BM') { boardMkt = val; render(); }
});

window.addEventListener('resize', () => requestAnimationFrame(paintAll));
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => requestAnimationFrame(paintAll));
new MutationObserver(() => requestAnimationFrame(paintAll))
  .observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

render();
</script>
