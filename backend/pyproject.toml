[project]
name = "screener"
version = "1.0.0"
description = "Qullamaggie screening dashboard backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "duckdb",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.setuptools.packages.find]
include = ["screener*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
